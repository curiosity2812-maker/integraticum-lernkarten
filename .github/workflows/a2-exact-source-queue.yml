name: A2 exact source queue
on:
  workflow_dispatch:
  push:
    branches: [feature/a2-dictionary-review]
    paths: ['.github/workflows/a2-exact-source-queue.yml']
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original source candidates
        run: |
          python - <<'PY'
          import json, pathlib, re, unicodedata, collections
          root=pathlib.Path('data')
          raw=json.loads((root/'integraticum_dictionary_cards_unverified.json').read_text())
          a1=json.loads((root/'integraticum_a1_reviewed.json').read_text())
          a2=json.loads((root/'integraticum_a2_reviewed.json').read_text())
          def norm(s):
              return re.sub(r'^(der|die|das|sich)\s+', '', unicodedata.normalize('NFC',s).strip(), flags=re.I).casefold()
          def rid(s):
              return s.removeprefix('dict_')
          def pos(s):
              return {'interjection':'intj','adjective':'adj','adverb':'adv','pronoun':'pron','preposition':'prep','conjunction':'conj'}.get(s,s)
          reviewed={rid(x['id']) for x in a1+a2}
          keys={(norm(x['de']),pos(x['part'])) for x in a1+a2}
          lookup=set('haushalt herstellen homepage husten instrument kenntnisse kette jugendherberge mittel natur nebenan verkehrsmittel vorgestern wach wahr'.split())
          rows=[]
          for x in raw:
              word=norm(x.get('word',''))
              if x.get('cefr_level')!='A2' and word not in lookup: continue
              if rid(x['id']) in reviewed: continue
              rows.append({'source':x,'same_lemma_part_reviewed':(word,pos(x.get('part_of_speech'))) in keys,'status':'candidate_only'})
          rows.sort(key=lambda x:(x['same_lemma_part_reviewed'],x['source'].get('part_of_speech') in ('name','abbrev'),x['source'].get('word','').casefold()))
          out=root/'a2_exact_candidates'
          out.mkdir(exist_ok=True)
          for p in out.glob('*.json'): p.unlink()
          for i in range(0,len(rows),30):
              (out/f'batch_{i//30+1:03}.json').write_text(json.dumps(rows[i:i+30],ensure_ascii=False,indent=2))
          manifest={'raw_cefr_counts':dict(collections.Counter(str(x.get('cefr_level')) for x in raw)),'reviewed_a2':len(a2),'remaining_raw_candidates':len(rows),'same_lemma_part_reviewed':sum(x['same_lemma_part_reviewed'] for x in rows),'status':'candidate_only','note':'Raw CEFR metadata or targeted lookup is not independent proof of level or sense.'}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Save candidate queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/a2_exact_candidates
          git diff --cached --quiet || git commit -m 'Extract original A2 source candidates'
          git push origin HEAD:feature/a2-dictionary-review

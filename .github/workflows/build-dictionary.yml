
name: Build German dictionary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract and shard German dictionary
        run: python scripts/build_dictionary.py --out dictionary

      - name: Package dictionary for review
        uses: actions/upload-artifact@v4
        with:
          name: integraticum-german-dictionary
          path: dictionary/
          retention-days: 7

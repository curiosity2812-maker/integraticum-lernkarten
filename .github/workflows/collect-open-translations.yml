
name: Collect open translations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect German-Russian translations
        run: python scripts/collect_open_translations.py --out translations/ru

      - name: Upload translation archive
        uses: actions/upload-artifact@v4
        with:
          name: integraticum-russian-translations
          path: translations/ru/
          retention-days: 7

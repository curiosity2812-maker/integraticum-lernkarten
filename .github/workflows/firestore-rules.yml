name: Firestore rules tests
on:
  pull_request:
  push:
    branches: [fix/course-stage2-followup]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase@13.4.0 @firebase/rules-unit-testing@latest firebase-tools@14
      - run: npx firebase emulators:exec --only firestore --project demo-integraticum "node tests/firestore-rules.mjs"
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save playwright firebase-tools@14
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("firebase.json"));c.emulators={auth:{port:9099},firestore:{port:8080}};fs.writeFileSync("firebase.json",JSON.stringify(c));'
      - run: npx firebase emulators:exec --only auth,firestore --project demo-integraticum "node tests/browser.mjs"

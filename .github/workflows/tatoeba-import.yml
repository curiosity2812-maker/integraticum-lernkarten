
name: Build Tatoeba German Russian examples

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and match Tatoeba sentence pairs and licensed audio
        run: python scripts/build_tatoeba.py --dictionary data/integraticum_sense_alignment_step2.zip --output tatoeba_result

      - name: Upload ready-to-use JSON shards and report
        uses: actions/upload-artifact@v4
        with:
          name: integraticum-tatoeba-examples
          path: tatoeba_result/
          if-no-files-found: error
          retention-days: 30

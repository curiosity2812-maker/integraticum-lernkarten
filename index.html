    const injection = audio + translation + warning;
    const close = '</section>';
    const at = html.indexOf(close);
    if (at >= 0) html = html.slice(0, at) + injection + html.slice(at);
    return html;
  };
  fetch(SOURCE, {cache:'no-cache'}).then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${SOURCE}`);
    return r.json();
  }).then(rows => {
    if (!Array.isArray(rows)) throw new Error('Ожидался массив карточек JSON');
    window.integraticumDictionaryCount = rows.length;
    const imported = rows.map((r, i) => {
      const wordText = String(r.word || '').trim();
      const gender = {masculine:'der',feminine:'die',neuter:'das'}[r.gender];
      const pos = ({adjective:'adj',adverb:'adv',preposition:'prep',pronoun:'pron',conjunction:'conj',numeral:'num',interjection:'intj'}[r.part_of_speech] || r.part_of_speech || 'other');
      return {id:'dict_'+(r.id || i), de:wordText && gender && !/^(der|die|das)\s/i.test(wordText) ? gender+' '+wordText : wordText,
        ru:(r.translation_candidates_ru || []).join('; ') || '—', uk:'', part:pos, level_verified:Boolean(r.cefr_source && r.cefr_source.name==='Goethe-Institut Wortliste' && r.cefr_source.match==='exact_headword'), level:(()=>{const raw=String(r.level ?? r.cefr_level ?? r.cefr ?? r.goethe_level ?? r.language_level ?? '').trim().toUpperCase();return /^(A1|A2|B1|B2|C1)$/.test(raw)?raw:''})(), topic:(Array.isArray(r.topics)&&r.topics.length?r.topics[0]:r.topic)||'Без темы', forms:'',
        example:r.example_de || '', example_ru:r.example_ru || '', official:true, dictionary_unverified:!r.translation_verified};
    }).filter(w=>w.de);
    // Retain the prototype cards, avoid exact duplicate labels.
    for (const w of imported) {
      if (!known.has(w.id)) { CATALOG.push(w); known.add(w.id); }
    }
    window.integraticumWordIndex = new Map([...CATALOG,...data.custom].map(w=>[w.id,w]));
    loading = false;
    if (['library','home','plan','review'].includes(page)) render();
  }).catch(err => {loading = false; error = err.message; if (['library','home','plan'].includes(page)) render(); console.error('Integraticum dictionary:', err);});
})();

function v6StartLearning(){
  const pool=selectedPool();
  const dueWords=pool.filter(due);
  const fresh=pool.filter(w=>!rec(w.id));
  const chosen=[...dueWords.slice(0,5),...fresh.slice(0,10)];
  if(!chosen.length){
    const more=pool.filter(w=>!!word(w.id)).slice(0,10);
    if(!more.length){alert('Нет доступных слов. Проверьте загрузку словаря или создайте набор.');return;}
    return startSession(more.map(w=>w.id),'smart');
  }
  startSession(uniqueIds(chosen.map(w=>w.id)),'smart');
}

 const pool=selectedPool();const fresh=pool.filter(w=>!rec(w.id)).length;const dueN=pool.filter(due).length;

 <button class="wide" onclick="v6StartLearning()">Начать заучивание →</button><div class="v6-note">Если повторений пока нет, начнём с новых слов.</div>`;
}

const v6OriginalRender=render;
render=function(){if(['home','library','plan'].includes(page)){const view=document.getElementById('view');view.innerHTML=page==='home'?v6Home():page==='library'?v6Library():v6Plan();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`go('${page}')`));return;}v6OriginalRender();};

 async function loadCourse(u){course.user=u;course.role='student';course.groups=[];course.memberships=[];course.requests=[];course.published=[];course.message='';if(!u){refreshCourse();return}
 try{

   course.requests=[];for(const g of course.groups.filter(x=>x.ownerUid===u.uid)){const requests=await getDocs(query(collection(db,'joinRequests'),where('groupId','==',g.id)));course.requests.push(...requests.docs.map(d=>({id:d.id,...d.data()})))}

 const canSeeSet=x=>x.visibility==='public'||(x.visibility==='group'&&(memberOf(x.groupId)||course.groups.some(g=>g.id===x.groupId&&owned(g))));

 const actions={view:courseView,hasMembership:()=>course.memberships.length>0||ownGroups().length>0,async reload(){await loadCourse(auth.currentUser)},async createGroup(){if(!isTeacher())return;const name=document.getElementById('groupName')?.value.trim(),level=document.getElementById('groupLevel')?.value;if(!name||name.length>90)return setMsg('Введите название группы (до 90 символов).');try{await addDoc(collection(db,'groups'),{name,level,code:randomCode(),ownerUid:course.user.uid,ownerName:course.user.displayName||course.user.email||'Преподаватель',createdAt:serverTimestamp()});await loadCourse(auth.currentUser);setMsg('Группа создана. Передайте ученикам код приглашения.')}catch(e){courseError(e)}},

 async reject(id){const r=course.requests.find(x=>x.id===id);if(!r||!ownGroups().some(g=>g.id===r.groupId))return;try{await updateDoc(doc(db,'joinRequests',id),{status:'rejected'});await loadCourse(auth.currentUser);setMsg('Заявка отклонена.')}catch(e){courseError(e)}},
 async publishSet(){if(!isTeacher())return;const id=document.getElementById('publishSet')?.value,groupId=document.getElementById('publishGroup')?.value,s=data.sets.find(x=>x.id===id);if(!s)return setMsg('Сначала создайте личный набор во вкладке «Мои наборы».');if(groupId!=='public'&&!ownGroups().some(g=>g.id===groupId))return setMsg('Нет доступа к выбранной группе.');const words=s.wordIds.map(word).filter(Boolean).map(w=>({de:w.de,ru:w.ru||'',uk:w.uk||'',part:w.part||'other',level:w.level||'A1',topic:w.topic||'',forms:w.forms||'',example:w.example||'',note:w.note||''}));if(words.length>150)return setMsg('Для публикации выберите набор не более 150 слов.');try{await addDoc(collection(db,'courseSets'),{name:s.name.slice(0,100),level:s.level,ownerUid:course.user.uid,ownerName:course.user.displayName||course.user.email||'Преподаватель',visibility:groupId==='public'?'public':'group',groupId:groupId==='public'?'':groupId,words,createdAt:serverTimestamp()});await loadCourse(auth.currentUser);setMsg('Копия набора опубликована.')}catch(e){courseError(e)}},

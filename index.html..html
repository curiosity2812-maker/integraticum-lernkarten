:root{font-family:'Montserrat',Arial,sans-serif;color:#503c60;background:#fcf8f1}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#715282;color:white;border:0;border-radius:12px;padding:12px 14px;font-weight:650;min-height:43px}button.secondary{background:white;border:1px solid #cdb9d4;color:#715282}button.ghost{background:transparent;color:#715282}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a48db3;outline-offset:2px}.app{max-width:760px;margin:auto;padding:18px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;letter-spacing:1.1px}.sub{font-size:11px;letter-spacing:2px;color:#806c89}.muted{color:#806c89}.tiny{font-size:12px}.card{background:#fff;border:1px solid #e9dfe9;border-radius:18px;padding:17px;margin:12px 0}.hero{background:#ede3f1}.warm{background:#f4ebdc}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stack{display:grid;gap:10px}.wide{width:100%}h1{font-size:26px;margin:8px 0 14px}h2{font-size:20px;margin:8px 0 12px}h3{font-size:16px;margin:8px 0}.tag{background:#ede3f1;color:#503c60;border-radius:30px;padding:5px 9px;font-size:12px;white-space:nowrap}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;background:#fff;border:1px solid #cdb9d4;border-radius:10px;padding:11px;color:#503c60}textarea{min-height:70px;resize:vertical}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:1px solid #e9dfe9;padding:7px 4px max(7px,env(safe-area-inset-bottom))}.nav button{flex:1;max-width:140px;font-size:11px;padding:9px 2px;background:transparent;color:#806c89}.nav button.active{background:#ede3f1;color:#503c60}.item{background:white;border:1px solid #e9dfe9;border-radius:13px;padding:12px;margin:8px 0}.item button{font-size:12px;padding:8px 10px;min-height:34px}.progress{height:8px;background:#e9dfe9;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#9074a0}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:white;color:#503c60;border:1px solid #d7c7df}.choice.picked{background:#ede3f1;border-color:#715282}.choice.right{background:#e1eedf;border-color:#6f9d75}.choice.wrong{background:#f9e0de;border-color:#ba7676}.center{text-align:center}.word{font-size:27px;font-weight:750;margin:22px 0}.note{padding:13px;border-radius:12px;background:#fcf8f1;margin:12px 0;line-height:1.5}.foot{font-size:12px;line-height:1.6;color:#806c89}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.hidden{display:none}.error{color:#9a3838}.success{color:#3b7c4b}hr{border:0;border-top:1px solid #e9dfe9;margin:16px 0}@media(min-width:850px){.app{padding-top:32px;padding-bottom:20px}.nav{position:static;max-width:760px;margin:0 auto 20px;border:1px solid #e9dfe9;border-radius:14px}}@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.grid{gap:7px}.card{padding:13px}.row.wrap{gap:6px}}

</style></head><body><main class="app"><header><div><div class="brand">INTEGRATICUM</div><div class="sub">LERNKARTEN · 0.4</div></div><div style="display:flex;align-items:center;gap:8px"><span class="auth-status" id="authStatus">Аккаунт: загрузка…</span><button class="secondary" onclick="go('account')" aria-label="Аккаунт">👤</button><button class="secondary" onclick="go('settings')" aria-label="Настройки">⚙</button></div></header><div id="view"><section class="card hero"><h1>Integraticum Lernkarten 0.4</h1><p>Библиотека, личные наборы и тренажёр.</p><p class="foot">Для работы приложения откройте страницу в браузере с JavaScript.</p></section></div></main><nav class="nav" id="nav"><button onclick="go('home')">Главная</button><button onclick="go('library')">Библиотека</button><button onclick="go('sets')">Мои наборы</button><button onclick="go('review')">Повторение</button><button onclick="go('progress')">Прогресс</button></nav><script>
'use strict';
const CATALOG=[

['der Tisch','стол','стіл','noun','A1','Жильё','die Tische','Der Tisch steht in der Küche.'],
['der Stuhl','стул','стілець','noun','A1','Жильё','die Stühle','Der Stuhl ist bequem.'],
['das Fenster','окно','вікно','noun','A1','Жильё','die Fenster','Das Fenster ist offen.'],
['die Tür','дверь','двері','noun','A1','Жильё','die Türen','Die Tür ist geschlossen.'],
['das Bett','кровать','ліжко','noun','A1','Жильё','die Betten','Das Bett ist neu.'],
['die Küche','кухня','кухня','noun','A1','Жильё','die Küchen','Die Küche ist klein.'],
['das Badezimmer','ванная комната','ванна кімната','noun','A1','Жильё','die Badezimmer','Das Badezimmer ist sauber.'],
['die Mutter','мать','мати','noun','A1','Семья','die Mütter','Meine Mutter wohnt in Zürich.'],
['der Bruder','брат','брат','noun','A1','Семья','die Brüder','Mein Bruder lernt Deutsch.'],
['die Schwester','сестра','сестра','noun','A1','Семья','die Schwestern','Meine Schwester arbeitet.'],
['die Familie','семья','сім’я','noun','A1','Семья','die Familien','Meine Familie ist groß.'],
['lernen','учить; изучать','вчити; вивчати','verb','A1','Повседневность','lernt · lernte · hat gelernt','Ich lerne jeden Tag Deutsch.'],
['arbeiten','работать','працювати','verb','A1','Работа','arbeitet · arbeitete · hat gearbeitet','Ich arbeite heute.'],
['wohnen','жить; проживать','жити; мешкати','verb','A1','Жильё','wohnt · wohnte · hat gewohnt','Wir wohnen in Zürich.'],
['kaufen','покупать','купувати','verb','A1','Повседневность','kauft · kaufte · hat gekauft','Ich kaufe Brot.'],
['umziehen','переезжать','переїжджати','verb','A2','Жильё','zieht um · zog um · ist umgezogen','Wir ziehen nächste Woche um.'],
['gemütlich','уютный','затишний','adj','A2','Жильё','gemütlicher · am gemütlichsten','Das Zimmer ist gemütlich.'],
['die Bewerbung','заявление о приёме на работу','заява про прийняття на роботу','noun','B1','Работа','die Bewerbungen','Ich schreibe eine Bewerbung.'],
['sich bewerben','подавать заявку','подавати заявку','verb','B1','Работа','bewirbt sich · bewarb sich · hat sich beworben','Sie bewirbt sich um eine Stelle.'],
['zuverlässig','надёжный','надійний','adj','B1','Работа','zuverlässiger · am zuverlässigsten','Er ist sehr zuverlässig.'],
['die Voraussetzung','предпосылка; необходимое условие','передумова; необхідна умова','noun','B2','Работа','die Voraussetzungen','Deutschkenntnisse sind eine Voraussetzung.'],
['sich entscheiden','принимать решение','ухвалювати рішення','verb','A2','Повседневность','entscheidet sich · entschied sich · hat sich entschieden','Ich muss mich entscheiden.']
].map((a,i)=>({id:'c'+i,de:a[0],ru:a[1],uk:a[2],part:a[3],level:a[4],topic:a[5],forms:a[6],example:a[7],official:true}));
const KEY='integraticum-v02';const defaults={version:2,sets:[],custom:[],records:{},history:[],selectedSets:[],lang:'ru',writing:'adaptive',newCount:5,reviewCount:10};let data=load(),page='home',filter={q:'',level:'all',topic:'all',part:'all'},selectedWord=null,selectedSet=null,editor=null,session=null,answer='',revealed=false,feedback=null,importPreview=[],bulkTarget=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===2?{...defaults,...x}:structuredClone(defaults)}catch{return structuredClone(defaults)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Не удалось сохранить данные. Возможно, память браузера недоступна. Экспортируйте резервную копию.')}}
function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function allWords(){return [...CATALOG,...data.custom]};function word(id){return allWords().find(w=>w.id===id)};function translation(w){return w[data.lang]||w.ru||w.uk||'—'};function today(){return new Date().toISOString().slice(0,10)};function rec(id){return data.records[id]};function due(w){return rec(w.id)&&rec(w.id).due<=Date.now()};function uniqueIds(a){return [...new Set(a)]};function typeName(p){return ({noun:'Существительное',verb:'Глагол',adj:'Прилагательное',adv:'Наречие',prep:'Предлог',other:'Выражение / другое'})[p]||p};function btn(text,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${text}</button>`};function countDue(){return allWords().filter(due).length};function activeIds(){let ids=data.selectedSets.flatMap(id=>(data.sets.find(s=>s.id===id)?.wordIds||[]));return uniqueIds(ids)};function selectedPool(){let ids=activeIds();return ids.length?ids.map(word).filter(Boolean):CATALOG.filter(w=>w.level==='A1')};
function go(p){page=p;render();window.scrollTo(0,0)}function render(){let views={home:homeView,library:libraryView,sets:setsView,review:reviewView,progress:progressView,settings:settingsView,account:accountView,word:wordView,set:setView,editor:editorView,bulk:bulkView,plan:planView,session:sessionView};document.getElementById('view').innerHTML=(views[page]||homeView)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')===`go('${page}')`));}
function homeView(){let total=Object.keys(data.records).length;return `<section class="card hero"><div class="sub">DEIN LERNPLAN</div><h1>Guten Tag!</h1><p>Повторения и новые слова — в удобном темпе.</p><button class="wide" onclick="go('plan')">▶ Продолжить обучение</button></section><section class="card warm row"><div><b>Повторение</b><p class="muted tiny">${countDue()} слов готовы к повторению</p></div>${btn('Открыть',"go('review')")}</section><section class="card"><h2>Быстрый доступ</h2><div class="grid">${`<div class="quick quick-library">${btn('Библиотека',"go('library')")}</div><div class="quick quick-sets">${btn('Мои наборы',"go('sets')")}</div><div class="quick quick-cards">${btn('Карточки',"startFree('cards')")}</div><div class="quick quick-choice">${btn('Выбор ответа',"startFree('choice')")}</div><div class="quick quick-typing">${btn('Написание',"startFree('typing')")}</div><div class="quick quick-recall">${btn('Самопроверка',"startFree('recall')")}</div>`}</div></section><section class="card home-progress"><h2>Мой прогресс</h2><p>${total} слов с историей обучения · ${data.history.filter(x=>x.ok).length} правильных попыток</p>${btn('Подробнее',"go('progress')")}</section>`}
function libraryView(){let levels=['all','A1','A2','B1','B2'],topics=['all',...new Set(allWords().map(w=>w.topic))],parts=['all','noun','verb','adj','adv','prep','other'];let result=allWords().filter(w=>(filter.level==='all'||w.level===filter.level)&&(filter.topic==='all'||w.topic===filter.topic)&&(filter.part==='all'||w.part===filter.part)&&`${w.de} ${w.ru} ${w.uk}`.toLocaleLowerCase().includes(filter.q.toLocaleLowerCase()));return `<h1>Bibliothek</h1><p class="muted">Готовые слова Integraticum и личные карточки.</p><div class="field"><label>Поиск по DE / RU / UK</label><input id="search" value="${e(filter.q)}" placeholder="Например: Wohnung" oninput="filter.q=this.value;refreshResults()"></div><div class="grid"><div class="field"><label>Уровень</label><select onchange="filter.level=this.value;render()">${levels.map(x=>`<option ${filter.level===x?'selected':''} value="${x}">${x==='all'?'Все уровни':x}</option>`).join('')}</select></div><div class="field"><label>Часть речи</label><select onchange="filter.part=this.value;render()">${parts.map(x=>`<option ${filter.part===x?'selected':''} value="${x}">${x==='all'?'Все части речи':typeName(x)}</option>`).join('')}</select></div></div><div class="field"><label>Тема</label><select onchange="filter.topic=this.value;render()">${topics.map(x=>`<option ${filter.topic===x?'selected':''} value="${e(x)}">${x==='all'?'Все темы':e(x)}</option>`).join('')}</select></div><div class="row wrap">${btn('Сбросить фильтры',"resetFilter()")}${btn('＋ Создать слово',"openEditor(null)")}</div><div id="results">${resultsHtml(result)}</div>`}
function resultsHtml(arr){return `<p class="muted tiny">Найдено: ${arr.length}</p>${arr.length?arr.map(w=>`<div class="item row"><div><b>${e(w.de)}</b> <span class="tag">${e(w.level)}</span><p class="muted tiny">${e(translation(w))} · ${e(w.topic)} · ${typeName(w.part)}</p></div>${btn('Открыть',`openWord('${w.id}')`)}</div>`).join(''):'<p class="note">Ничего не найдено.</p>'}`}
function refreshResults(){let arr=allWords().filter(w=>(filter.level==='all'||w.level===filter.level)&&(filter.topic==='all'||w.topic===filter.topic)&&(filter.part==='all'||w.part===filter.part)&&`${w.de} ${w.ru} ${w.uk}`.toLocaleLowerCase().includes(filter.q.toLocaleLowerCase()));document.getElementById('results').innerHTML=resultsHtml(arr)}function resetFilter(){filter={q:'',level:'all',topic:'all',part:'all'};render()}
function openWord(id){selectedWord=id;go('word')}function wordView(){let w=word(selectedWord);if(!w)return '<p>Карточка не найдена.</p>';return `<div class="row">${btn('← Библиотека',"go('library')")}<span class="tag">${w.official?'Integraticum':'Личная'}</span></div><section class="card hero"><p class="sub">${typeName(w.part).toUpperCase()} · ${e(w.level)} · ${e(w.topic)}</p><div class="word">${e(w.de)}</div><p><b>RU:</b> ${e(w.ru||'—')}</p><p><b>UK:</b> ${e(w.uk||'—')}</p>${w.forms?`<p><b>Формы:</b> ${e(w.forms)}</p>`:''}${w.example?`<p><b>Пример:</b> ${e(w.example)}</p>`:''}${w.note?`<p>${e(w.note)}</p>`:''}</section><section class="card"><h3>Добавить в набор</h3><div class="field"><select id="targetset"><option value="">Выбери набор</option>${data.sets.map(s=>`<option value="${s.id}">${e(s.name)}</option>`).join('')}</select></div><div class="actions">${btn('Добавить',"addToChosenSet()",'')}${btn('Создать набор',"newSet()")}</div></section><section class="card"><h3>Изменения</h3><p class="foot">Официальные карточки не изменяются: редактирование создаёт личную копию.</p><div class="actions">${btn(w.official?'Создать личную копию':'Редактировать',`openEditor('${w.id}')`)}${!w.official?btn('Удалить',`deleteWord('${w.id}')`):''}</div></section>`}
function addToChosenSet(){let id=document.getElementById('targetset').value;if(!id)return alert('Сначала выбери набор.');let s=data.sets.find(s=>s.id===id);if(!s.wordIds.includes(selectedWord))s.wordIds.push(selectedWord);save();alert('Карточка добавлена в набор.');render()}
function newSet(){let name=prompt('Название нового набора:');if(!name?.trim())return;let id='s'+Date.now()+Math.random().toString(36).slice(2,6);data.sets.push({id,name:name.trim(),description:'',level:'A1',topic:'Другое',wordIds:[]});data.selectedSets.push(id);save();selectedSet=id;go('set')}
function setsView(){return `<div class="row"><h1>Meine Lernsets</h1>${btn('＋ Создать',"newSet()",'')}</div><p class="muted">Собственные наборы и выбранные для умной тренировки темы.</p>${data.sets.length?data.sets.map(s=>`<div class="item row"><div><b>${e(s.name)}</b><p class="tiny muted">${s.wordIds.length} слов · ${e(s.level)} · ${e(s.topic)}</p><label class="tiny"><input type="checkbox" style="width:auto" ${data.selectedSets.includes(s.id)?'checked':''} onchange="toggleSet('${s.id}',this.checked)"> Активен в умном плане</label></div>${btn('Открыть',`openSet('${s.id}')`)}</div>`).join(''):'<section class="card"><p>Пока нет личных наборов. Создай первый или выбери слова в библиотеке.</p></section>'}<p class="foot">Готовые слова можно добавлять в несколько наборов. Их прогресс учитывается один раз.</p>`}
function toggleSet(id,on){data.selectedSets=on?uniqueIds([...data.selectedSets,id]):data.selectedSets.filter(x=>x!==id);save()}function openSet(id){selectedSet=id;go('set')}
function setView(){let s=data.sets.find(s=>s.id===selectedSet);if(!s)return '<p>Набор не найден.</p>';return `<div class="row">${btn('← Мои наборы',"go('sets')")}${btn('Удалить набор',`deleteSet('${s.id}')`)}</div><h1>${e(s.name)}</h1><div class="card"><div class="grid"><div class="field"><label>Уровень</label><select id="setLevel">${['A1','A2','B1','B2','mixed'].map(v=>`<option ${s.level===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Тема</label><input id="setTopic" value="${e(s.topic)}"></div></div><div class="field"><label>Описание</label><textarea id="setDesc">${e(s.description)}</textarea></div>${btn('Сохранить описание',"saveSetInfo()")}</div><div class="actions">${btn('＋ Добавить слово',"openEditor(null)",'')}${btn('Из словаря',"go('library')")}${btn('Массовый ввод',"openBulk()")}</div><section class="card hero"><p>${s.wordIds.length} слов в наборе</p><div class="actions">${btn('Карточки',`startSet('${s.id}','cards')`,'')}${btn('Умная тренировка',`startSet('${s.id}','smart')`)}</div></section>${s.wordIds.map(id=>{let w=word(id);return w?`<div class="item row"><div><b>${e(w.de)}</b><p class="muted tiny">${e(translation(w))}</p></div><div class="actions">${btn('Открыть',`openWord('${id}')`)}${btn('×',`removeFromSet('${id}')`)}</div></div>`:''}).join('')}`}
function saveSetInfo(){let s=data.sets.find(s=>s.id===selectedSet);s.level=document.getElementById('setLevel').value;s.topic=document.getElementById('setTopic').value.trim()||'Другое';s.description=document.getElementById('setDesc').value.trim();save();render()}function removeFromSet(id){let s=data.sets.find(s=>s.id===selectedSet);s.wordIds=s.wordIds.filter(x=>x!==id);save();render()}function deleteSet(id){if(!confirm('Удалить набор? Карточки и прогресс останутся.'))return;data.sets=data.sets.filter(s=>s.id!==id);data.selectedSets=data.selectedSets.filter(x=>x!==id);save();go('sets')}
function openEditor(id){let w=id?word(id):null;editor={originalId:id,copy:!!w?.official,targetSet:selectedSet||'',values:w?{...w}:{de:'',ru:'',uk:'',part:'noun',level:'A1',topic:'Другое',forms:'',example:'',note:''}};go('editor')}
function editorView(){let w=editor.values;let found=allWords().filter(x=>x.de.toLocaleLowerCase('de')===w.de.trim().toLocaleLowerCase('de')&&x.id!==editor.originalId);return `<div class="row">${btn('← Назад',"go('sets')")}<span class="tag">${editor.copy?'Личная копия':editor.originalId?'Редактирование':'Новая карточка'}</span></div><h1>Neue Lernkarte</h1><p class="muted">Достаточно немецкого слова и одного перевода. Остальное необязательно.</p><div class="card"><div class="field"><label>Немецкое слово или выражение *</label><input id="f_de" value="${e(w.de)}" oninput="editor.values.de=this.value;checkDuplicates()" placeholder="die Wohnung"></div><div id="duplicates">${duplicateHtml(found)}</div><div class="grid"><div class="field"><label>Перевод RU</label><input id="f_ru" value="${e(w.ru)}"></div><div class="field"><label>Перевод UK</label><input id="f_uk" value="${e(w.uk)}"></div></div><div class="grid"><div class="field"><label>Часть речи</label><select id="f_part">${['noun','verb','adj','adv','prep','other'].map(v=>`<option value="${v}" ${w.part===v?'selected':''}>${typeName(v)}</option>`).join('')}</select></div><div class="field"><label>Уровень</label><select id="f_level">${['A1','A2','B1','B2','mixed'].map(v=>`<option ${w.level===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Тема</label><input id="f_topic" value="${e(w.topic)}"></div><details><summary>Дополнительные данные</summary><div class="field"><label>Формы (Plural / Präsens · Präteritum · Perfekt / сравнение)</label><input id="f_forms" value="${e(w.forms)}" placeholder="die Wohnungen"></div><div class="field"><label>Пример на немецком</label><textarea id="f_example">${e(w.example)}</textarea></div><div class="field"><label>Заметка</label><textarea id="f_note">${e(w.note)}</textarea></div></details><div class="field"><label>Добавить в набор</label><select id="f_set"><option value="">Без набора</option>${data.sets.map(s=>`<option value="${s.id}" ${editor.targetSet===s.id?'selected':''}>${e(s.name)}</option>`).join('')}</select></div><button class="wide" onclick="saveEditor()">Сохранить карточку</button></div>`}
function duplicateHtml(arr){return arr.length?`<div class="note"><b>Есть совпадение в словаре:</b>${arr.slice(0,4).map(w=>`<div class="row" style="margin-top:8px"><span>${e(w.de)} · ${e(translation(w))}</span>${btn('Использовать',`reuseWord('${w.id}')`)}</div>`).join('')}<p class="foot">Можно использовать готовую карточку или продолжить создание собственной.</p></div>`:''}
function checkDuplicates(){let val=editor.values.de.trim().toLocaleLowerCase('de');document.getElementById('duplicates').innerHTML=duplicateHtml(val?allWords().filter(w=>w.de.toLocaleLowerCase('de')===val&&w.id!==editor.originalId):[])}
function reuseWord(id){let target=document.getElementById('f_set').value;if(!target){selectedWord=id;go('word');return}let s=data.sets.find(s=>s.id===target);s.wordIds=uniqueIds([...s.wordIds,id]);save();selectedSet=target;go('set')}
function saveEditor(){let val={};for(let k of ['de','ru','uk','part','level','topic'])val[k]=document.getElementById('f_'+k).value.trim();for(let k of ['forms','example','note'])val[k]=document.getElementById('f_'+k)?.value.trim()||'';if(!val.de||(!val.ru&&!val.uk))return alert('Нужно указать немецкое слово и хотя бы один перевод.');let id=editor.originalId&&!editor.copy?editor.originalId:'u'+Date.now()+Math.random().toString(36).slice(2,6);let obj={...val,id,official:false};if(editor.originalId&&!editor.copy){data.custom=data.custom.map(w=>w.id===id?obj:w)}else data.custom.push(obj);let target=document.getElementById('f_set').value;if(target){let s=data.sets.find(s=>s.id===target);s.wordIds=uniqueIds([...s.wordIds,id])}save();selectedWord=id;go('word')}
function deleteWord(id){if(!confirm('Удалить личную карточку и её историю обучения?'))return;data.custom=data.custom.filter(w=>w.id!==id);data.sets.forEach(s=>s.wordIds=s.wordIds.filter(x=>x!==id));delete data.records[id];data.history=data.history.filter(h=>h.id!==id);save();go('library')}
function openBulk(){bulkTarget=selectedSet;importPreview=[];go('bulk')}
function bulkView(){return `<div class="row">${btn('← Назад',"go('set')")}<span class="tag">Массовый ввод</span></div><h1>Importieren</h1><p class="muted">Вставь по одному слову в строке: <b>die Wohnung — квартира</b>. Можно использовать «;» или табуляцию.</p><div class="card"><textarea id="bulkText" style="min-height:180px" placeholder="die Wohnung — квартира\nder Schrank — шкаф\ngemütlich — уютный"></textarea><div class="actions">${btn('Проверить список',"previewBulk()",'')}</div></div><div id="bulkPreview">${bulkPreviewHtml()}</div>`}
function previewBulk(){let txt=document.getElementById('bulkText').value;importPreview=txt.split(/\r?\n/).map(line=>{let p=line.split(/\s+[—–-]\s+|\t|;/);return {de:(p[0]||'').trim(),ru:(p.slice(1).join(';')||'').trim()}}).filter(w=>w.de&&w.ru).slice(0,300);document.getElementById('bulkPreview').innerHTML=bulkPreviewHtml()}
function bulkPreviewHtml(){return importPreview.length?`<section class="card"><h3>Предпросмотр: ${importPreview.length} строк</h3>${importPreview.slice(0,12).map(w=>`<p class="tiny"><b>${e(w.de)}</b> — ${e(w.ru)} ${allWords().some(x=>x.de.toLowerCase()===w.de.toLowerCase())?'· найдено совпадение':''}</p>`).join('')}${importPreview.length>12?'<p class="foot">Показаны первые 12 строк.</p>':''}<p class="foot">Совпадающие немецкие формы будут использованы из словаря. Если значение отличается, добавь отдельную карточку вручную.</p>${btn('Импортировать в набор',"commitBulk()",'')}</section>`:''}
function commitBulk(){let s=data.sets.find(s=>s.id===bulkTarget);if(!s)return alert('Набор не найден.');let added=0;for(let v of importPreview){let existing=allWords().find(w=>w.de.toLocaleLowerCase('de')===v.de.toLocaleLowerCase('de'));let id;if(existing){id=existing.id}else{id='u'+Date.now()+Math.random().toString(36).slice(2,8);data.custom.push({id,de:v.de,ru:v.ru,uk:'',part:'other',level:s.level,topic:s.topic,forms:'',example:'',note:'',official:false})}if(!s.wordIds.includes(id)){s.wordIds.push(id);added++}}save();alert(`Добавлено в набор: ${added}.`);selectedSet=s.id;go('set')}
function planView(){let pool=selectedPool(),dueWords=pool.filter(due),fresh=pool.filter(w=>!rec(w.id));return `<h1>Dein Lernplan</h1><p class="muted">Настрой занятие. Доступно: ${dueWords.length} повторений и ${fresh.length} новых слов в выбранных наборах.</p><section class="card hero"><div class="field"><label>Повторения: <b id="reviewValue">${data.reviewCount}</b></label><input type="range" min="0" max="20" value="${data.reviewCount}" oninput="document.getElementById('reviewValue').textContent=this.value" id="reviewCount"></div><div class="field"><label>Новые слова: <b id="newValue">${data.newCount}</b></label><input type="range" min="0" max="20" value="${data.newCount}" oninput="document.getElementById('newValue').textContent=this.value" id="newCount"></div><div class="field"><label>Написание</label><select id="writing"><option value="adaptive" ${data.writing==='adaptive'?'selected':''}>Адаптивное</option><option value="yes" ${data.writing==='yes'?'selected':''}>С написанием</option><option value="no" ${data.writing==='no'?'selected':''}>Без написания</option></select></div><button class="wide" onclick="startPlan()">Начать занятие</button></section><p class="foot">Если слов меньше, чем запрошено, занятие будет короче. При отсутствии выбранных наборов используются демонстрационные слова A1.</p>`}
function startPlan(){data.reviewCount=+document.getElementById('reviewCount').value;data.newCount=+document.getElementById('newCount').value;data.writing=document.getElementById('writing').value;save();let pool=selectedPool(),rev=pool.filter(due).sort((a,b)=>rec(a.id).due-rec(b.id).due).slice(0,data.reviewCount),fresh=pool.filter(w=>!rec(w.id)).slice(0,data.newCount);startSession(uniqueIds([...rev,...fresh].map(w=>w.id)),'smart')}
function startFree(mode){let ids=selectedPool().slice(0,12).map(w=>w.id);startSession(ids,mode)}function startSet(id,mode){let s=data.sets.find(x=>x.id===id);startSession(s.wordIds,mode)}function startSession(ids,mode){let q=uniqueIds(ids).filter(id=>word(id)).map(id=>({id,tries:0}));if(!q.length)return alert('В наборе пока нет слов для занятия.');session={queue:q,index:0,mode,correct:0,results:[]};answer='';revealed=false;feedback=null;go('session')}
function exerciseMode(item){if(session.mode!=='smart')return session.mode;if(item.tries>0)return data.writing==='yes'?'typing':'recall';let r=rec(item.id);if(!r)return 'cards';if(data.writing==='yes')return 'typing';if(data.writing==='no')return 'recall';return r.seen%2===0?'choice':'typing'}
function choices(w){let pool=allWords().filter(x=>x.id!==w.id&&translation(x)!==translation(w));let same=pool.filter(x=>x.part===w.part).slice(0,3);if(same.length<3)same.push(...pool.filter(x=>!same.includes(x)).slice(0,3-same.length));let arr=[w,...same];let seed=session.index*3+w.id.length;return arr.sort((a,b)=>hash(a.id+seed)-hash(b.id+seed))}function hash(s){return [...s].reduce((a,c)=>((a*31+c.charCodeAt(0))>>>0),7)}
function sessionView(){if(!session)return '<p>Нет активного занятия.</p>';if(session.index>=session.queue.length)return `<h1>Gut gemacht!</h1><section class="card center"><h2>Занятие завершено</h2><p>${session.results.length} проверок · ${session.correct} успешных</p><p class="foot">Ошибки учтены в следующем повторении.</p>${btn('На главную',"endSession()",'')}</section>`;let item=session.queue[session.index],w=word(item.id),mode=exerciseMode(item),pct=Math.round(100*session.index/session.queue.length),controls='';if(mode==='cards'||mode==='recall'){controls=`<div class="center"><p class="muted">${mode==='cards'?'Знакомство со словом':'Вспомни немецкое слово без подсказки'}</p><div class="word">${e(mode==='cards'?w.de:translation(w))}</div>${revealed?`<div class="note"><b>${e(w.de)}</b> — ${e(translation(w))}${w.forms?`<br><small>${e(w.forms)}</small>`:''}${w.example?`<br><small>${e(w.example)}</small>`:''}</div><div class="grid">${btn('Не вспомнил',"finishRecall(false)")}${btn('Вспомнил',"finishRecall(true)",'')}</div>`:btn('Показать ответ',"revealed=true;render()",'')}</div>`}else if(mode==='typing'){controls=`<p class="muted">Напиши немецкое слово${w.part==='noun'?' с артиклем':''}:</p><div class="word center">${e(translation(w))}</div><input id="typed" type="text" autocomplete="off" autocapitalize="off" placeholder="Введите ответ" value="${e(answer)}" oninput="answer=this.value" ${feedback?'disabled':''}>${feedback?`<div class="note">${feedback.ok?'✓ Правильно':`Правильный ответ: <b>${e(w.de)}</b>`}<br>${e(feedback.explanation||'')}</div>${btn('Далее',"nextQuestion()",'wide')}`:btn('Проверить',"checkTyped()",'wide')}`}else{controls=`<p class="muted">Выбери правильный перевод:</p><div class="word center">${e(w.de)}</div>${choices(w).map(o=>`<button class="choice ${feedback?(o.id===w.id?'right':o.id===answer?'wrong':''):o.id===answer?'picked':''}" onclick="pick('${o.id}')" ${feedback?'disabled':''}>${e(translation(o))}</button>`).join('')}${feedback?`<div class="note">${feedback.ok?'✓ Richtig!':`Правильно: ${e(translation(w))}`}<br>${e(feedback.explanation||'')}</div>${btn('Далее',"nextQuestion()",'wide')}`:btn('Проверить',"checkChoice()",'wide')}`};return `<div class="row">${btn('← Пауза',"pauseSession()")}<span class="tag">${({cards:'Lernkarten',recall:'Erinnern',typing:'Schreiben',choice:'Auswahl'})[mode]}</span></div><p class="tiny muted">Задание ${session.index+1} из ${session.queue.length}</p><div class="progress"><div style="width:${pct}%"></div></div><section class="card">${controls}</section><p class="foot">${mode==='cards'||mode==='recall'?'Самооценка не проверяется автоматически.':'Результат сохраняется после подтверждения ответа.'}</p>`}
function pick(id){answer=id;render()}function checkChoice(){if(!answer)return;let w=word(session.queue[session.index].id);feedback={ok:answer===w.id,partial:false,errorType:answer===w.id?'correct':'meaning',explanation:answer===w.id?'Верно! Значение определено правильно.':'Это другое значение. Сравни варианты и повтори слово.'};render()}function norm(s){return String(s||'').normalize('NFC').trim().toLocaleLowerCase('de').replace(/\s+/g,' ')}
function spellingDistance(a,b){let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let row=[i];for(let j=1;j<=b.length;j++)row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=row}return prev[b.length]}
function classifyTyped(input,w){let actual=norm(input),expected=norm(w.de);if(actual===expected)return {ok:true,partial:false,errorType:'correct',explanation:'Правильно! Написание проверено.'};if(!actual)return {ok:false,partial:false,errorType:'empty',explanation:'Ответ не введён. Посмотри правильное написание.'};let noun=w.part==='noun'&&/^(der|die|das)\s+/i.test(expected);let strip=x=>x.replace(/^(der|die|das)\s+/,'');let core=strip(expected),given=strip(actual);if(noun&&core===given){let article=/^(der|die|das)\s+/.exec(actual);return {ok:false,partial:true,errorType:article?'article_wrong':'article_missing',explanation:article?'Слово написано правильно, но артикль неверный.':'Слово написано правильно, но артикль пропущен.'}}
let distance=spellingDistance(actual,expected);if(distance<=Math.max(1,Math.floor(expected.length*.2))||(noun&&spellingDistance(given,core)<=Math.max(1,Math.floor(core.length*.2))))return {ok:false,partial:true,errorType:'spelling',explanation:'Похоже на орфографическую ошибку. Сравни написание с образцом.'};return {ok:false,partial:false,errorType:'meaning',explanation:'Ответ не совпадает с ожидаемым словом. Проверь значение и написание.'}}
function checkTyped(){let w=word(session.queue[session.index].id);feedback=classifyTyped(answer,w);render()}
function finishRecall(ok){feedback={ok,partial:false};nextQuestion()}
function nextQuestion(){if(!feedback)return;let item=session.queue[session.index],w=word(item.id),mode=exerciseMode(item),ok=feedback.ok,r=rec(w.id)||{seen:0,streak:0};let streak=ok?r.streak+1:0,days=ok?[1,3,7,14,30,60][Math.min(streak-1,5)]:1;data.records[w.id]={seen:r.seen+1,streak,due:Date.now()+days*86400000,lastMode:mode};data.history.push({id:w.id,ok,mode,partial:feedback.partial,errorType:feedback.errorType||(ok?'correct':'recall'),at:Date.now()});data.history=data.history.slice(-2000);session.results.push({id:w.id,ok});if(ok)session.correct++;if(!ok&&item.tries<1)session.queue.push({id:w.id,tries:item.tries+1});session.index++;answer='';revealed=false;feedback=null;save();render()}
function pauseSession(){if(confirm('Закончить занятие? Уже проверенные ответы сохранены.')){session=null;go('home')}}function endSession(){session=null;go('home')}
function reviewView(){let dueList=allWords().filter(due).sort((a,b)=>rec(a.id).due-rec(b.id).due);return `<h1>Wiederholung</h1><section class="card hero"><h2>${dueList.length} слов для повторения</h2><p class="muted">Без штрафов за пропущенные дни.</p><button class="wide" ${!dueList.length?'disabled':''} onclick="startSession(${JSON.stringify(dueList.slice(0,15).map(w=>w.id)).replace(/"/g,"'")},'smart')">Повторить до 15 слов</button></section>${dueList.slice(0,30).map(w=>`<div class="item row"><b>${e(w.de)}</b><span class="muted tiny">${e(translation(w))}</span></div>`).join('')}`}
function progressView(){let records=Object.values(data.records),consolidated=records.filter(r=>r.streak>=4).length;return `<h1>Mein Fortschritt</h1><div class="grid"><div class="card"><h2>${records.length}</h2><p class="muted">Начато слов</p></div><div class="card"><h2>${consolidated}</h2><p class="muted">Закреплено*</p></div><div class="card"><h2>${countDue()}</h2><p class="muted">К повторению</p></div><div class="card"><h2>${data.history.length}</h2><p class="muted">Проверок</p></div></div><section class="card"><h3>Результаты по типам заданий</h3>${['choice','typing','cards','recall'].map(m=>{let h=data.history.filter(x=>x.mode===m);return `<p>${({choice:'Выбор',typing:'Написание',cards:'Карточки',recall:'Самопроверка'})[m]}: ${h.length?Math.round(100*h.filter(x=>x.ok).length/h.length)+'%':'пока нет данных'} (${h.length})</p>`}).join('')}<p class="foot">*Условный показатель: четыре последовательных успешных проверки. Это не гарантия долговременного знания.</p><h3>Типы ошибок</h3>${[['article_wrong','Неверный артикль'],['article_missing','Пропущен артикль'],['spelling','Орфография'],['meaning','Значение / другой ответ'],['empty','Пустой ответ']].map(([k,v])=>`<p>${v}: ${data.history.filter(x=>x.errorType===k).length}</p>`).join('')}</section>`}
function accountView(){let u=window.integraticumUser;return `<h1>Mein Konto · Аккаунт</h1><section class="card"><h2>${u?'Вы вошли в аккаунт':'Регистрация и вход'}</h2>${u?`<div class="auth-profile"><b>${e(u.displayName||u.email||'Ученик')}</b><p class="tiny">${e(u.email||'Google аккаунт')}</p><p class="auth-hint">ID: ${e(u.uid)}</p></div><p class="auth-note">Вход работает через Firebase. Прогресс, наборы и история пока сохраняются только в этом браузере. Облачная синхронизация будет подключена после настройки безопасных правил доступа.</p><button class="secondary" onclick="window.integraticumAuth.signOut()">Выйти</button>`:`<p class="muted">Войдите, чтобы создать аккаунт Integraticum. Данные тренировок пока остаются на устройстве.</p><label for="authEmail">Электронная почта</label><input class="auth-input" id="authEmail" type="email" autocomplete="email" placeholder="name@example.com"><label for="authPassword">Пароль (не менее 6 символов)</label><input class="auth-input" id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••"><div class="auth-actions"><button onclick="window.integraticumAuth.email('register')">Зарегистрироваться</button><button class="secondary" onclick="window.integraticumAuth.email('login')">Войти</button></div><p style="text-align:center">или</p><button class="secondary wide" onclick="window.integraticumAuth.google()">Войти через Google</button><p id="authError" class="auth-error" role="alert"></p><p class="auth-hint">При регистрации через email Firebase может отправить письмо для подтверждения адреса. Не используйте здесь пароль от других сервисов.</p>`}</section><section class="card"><h3>Учебная группа Integraticum</h3><p class="auth-note">Принадлежность к группе будет подтверждать преподаватель. Самостоятельный выбор группы не даёт доступа к закрытым материалам.</p><p class="muted tiny">Группы, роли преподавателей, облачное сохранение и отчёты об активности будут добавлены на следующем этапе.</p></section>`}
